apiVersion: apps/v1
kind: Deployment
metadata:
  name: threads
  namespace: prakarsa
  labels:
    app: threads
spec:
  replicas: 1
  selector:
    matchLabels:
      app: threads
  template:
    metadata:
      labels:
        app: threads
  spec:
    revisionHistoryLimit: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0   
        maxSurge: 1         
    template:
      spec:
        terminationGracePeriodSeconds: 10
        containers:
          - name: threads
            imagePullPolicy: Always
            readinessProbe:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 10
              periodSeconds: 10
            livenessProbe:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 20