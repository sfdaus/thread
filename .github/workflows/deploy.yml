name: CI/CD Threads

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/threads

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner (for org/user case-insensitivity)
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/threads
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          debug: true
          script: |
            echo "Connected"
            # pastikan kubeconfig default k3s
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            # pastikan namespace ada
            kubectl get ns prakarsa >/dev/null 2>&1 || kubectl create ns prakarsa
            # set image ke latest (owner ganti kepunyaanmu)
            kubectl -n prakarsa set image deploy/threads threads=ghcr.io/sfdaus/threads:latest --record || true
            # apply semua manifest
            kubectl -n prakarsa apply -f /path/repo/k8s/ || true
            kubectl -n prakarsa rollout status deploy/threads --timeout=180s

      - name: Set image in deployment (latest)
        run: |
          # Pastikan owner/org lower-case untuk path GHCR
          OWNER="${{ steps.vars.outputs.owner_lc }}"
          kubectl -n prakarsa set image deploy/threads threads=ghcr.io/${OWNER}/threads:latest --record || true

      - name: Apply manifests (create/update)
        run: |
          kubectl -n prakarsa apply -f k8s/
          kubectl -n prakarsa rollout status deploy/threads --timeout=180s
