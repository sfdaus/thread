name: CI/CD Threads
on:
  push: { branches: [main] }
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository_owner }}/threads

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/threads
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # === COPY manifest dari repo ke VPS ===
      - name: Copy k8s manifests to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "k8s/*"
          target: "/opt/threads/k8s"

      # === APPLY + SET IMAGE di VPS ===
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            NS=prakarsa
            OWNER="${{ steps.vars.outputs.owner_lc }}"
            IMAGE="ghcr.io/${OWNER}/threads:latest"

            # pastikan namespace ada
            kubectl get ns $NS >/dev/null 2>&1 || kubectl create ns $NS

            # apply semua manifest dari repo yg barusan di-copy
            kubectl -n $NS apply -f /opt/threads/k8s/

            # update image (aman walau pertama kali)
            kubectl -n $NS set image deploy/threads threads=$IMAGE --record || true

            # tunggu rollout
            kubectl -n $NS rollout status deploy/threads --timeout=180s
