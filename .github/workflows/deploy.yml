name: CI/CD Threads
on:
  push: { branches: [main] }
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository_owner }}/threads

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/threads
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/threads:latest
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/threads:${{ github.sha }}

      - name: Copy k8s manifests to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "k8s/*"
          target: "threads"
          
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            NS=prakarsa
            OWNER="${{ steps.vars.outputs.owner_lc }}"
            TAG="${{ github.sha }}"
            IMAGE="ghcr.io/${OWNER}/threads:${TAG}"

            kubectl get ns $NS >/dev/null 2>&1 || kubectl create ns $NS
            kubectl -n $NS apply -f ~/threads/k8s/

            # SELALU ganti image ke tag SHA -> memicu rollout baru
            kubectl -n $NS set image deploy/threads threads=$IMAGE --record

            # Tunggu rollout; kalau gagal, dump debug biar gampang nyari sebabnya
            if ! kubectl -n $NS rollout status deploy/threads --timeout=300s; then
              kubectl -n $NS get pods -o wide
              kubectl -n $NS describe deploy/threads
              POD=$(kubectl -n $NS get pod -l app=threads -o jsonpath='{.items[-1:].0.metadata.name}')
              kubectl -n $NS describe pod "$POD" || true
              kubectl -n $NS logs "$POD" --tail=200 || true
              exit 1
            fi