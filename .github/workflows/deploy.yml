name: build-and-deploy
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      # ------ TAGGING: latest + FULL SHA (tanpa prefix) ------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/threads
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # --------- SCP k8s manifests (k8s/*) ke VPS (optional) ---------
      - name: Copy k8s manifests to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "k8s/*"
          target: "threads/k8s"

      # ------------------- DEPLOY dgn guard & cleanup -------------------
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            NS=prakarsa
            APP=threads
            OWNER="${{ steps.vars.outputs.owner_lc }}"
            TAG="${{ github.sha }}"
            IMAGE="ghcr.io/${OWNER}/threads:${TAG}"

            kubectl get ns $NS >/dev/null 2>&1 || kubectl create ns $NS
            kubectl -n $NS apply -f ~/threads/k8s/

            # Set image ke FULL SHA -> trigger rollout
            kubectl -n $NS set image deploy/$APP $APP=$IMAGE --record

            echo ">> Wait Available (max 10m)..."
            if ! kubectl -n $NS wait deploy/$APP --for=condition=available --timeout=600s; then
              echo ">> Debug:"
              kubectl -n $NS get pods -l app=$APP -o wide
              POD=$(kubectl -n $NS get pods -l app=$APP --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].0.metadata.name}')
              kubectl -n $NS describe pod "$POD" || true
              kubectl -n $NS logs "$POD" --tail=200 || true
              exit 1
            fi

            echo ">> Verify no ImagePullBackOff on newest pod"
            POD=$(kubectl -n $NS get pods -l app=$APP --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].0.metadata.name}')
            REASON=$(kubectl -n $NS get pod "$POD" -o jsonpath='{.status.containerStatuses[0].state.waiting.reason}' 2>/dev/null || true)
            if [ "$REASON" = "ImagePullBackOff" ] || [ "$REASON" = "ErrImagePull" ]; then
              echo "New pod cannot pull image: $IMAGE"
              kubectl -n $NS get events --sort-by=.lastTimestamp | tail -n 20 || true
              exit 1
            fi

            echo ">> Cleanup: keep 2 ReplicaSets & 2 images"
            # 1) pangkas RS lama (replicas=0), sisakan 2 termuda
            kubectl -n $NS get rs -l app=$APP --sort-by=.metadata.creationTimestamp \
              -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.replicas}{"\n"}{end}' \
            | awk '$2==0{print $1}' | head -n -2 | xargs -r kubectl -n $NS delete rs

            # 2) hapus images di node (containerd) selain 2 image terakhir (current+previous)
            IMAGES_SORTED=$(kubectl -n $NS get rs -l app=$APP \
              -o jsonpath='{range .items[*]}{.metadata.creationTimestamp}{" "}{.spec.template.spec.containers[0].image}{"\n"}{end}' | sort)
            KEEP1=$(echo "$IMAGES_SORTED" | tail -n1 | awk '{print $2}')
            KEEP2=$(echo "$IMAGES_SORTED" | tail -n2 | head -n1 | awk '{print $2}')
            echo "Keep images on node: $KEEP1 , $KEEP2"

            for IMG in $(sudo ctr -n k8s.io images ls | awk -v r="ghcr.io/${OWNER}/threads" '$1 ~ r {print $1}'); do
              if [ "$IMG" != "$KEEP1" ] && [ "$IMG" != "$KEEP2" ]; then
                echo "Removing $IMG"
                sudo ctr -n k8s.io images rm "$IMG" || true
              fi
            done

            echo ">> Done"
